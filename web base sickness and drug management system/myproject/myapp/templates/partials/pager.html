{% if page_obj.paginator.num_pages > 1 %}
<div class="flex items-center justify-between px-4 py-3 border-t text-sm muted" style="border-color:var(--line)">
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div class="flex gap-2">
    {% if page_obj.has_previous %}<a class="btn btn-ghost" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-ghost" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% endif %}
  </div>
</div>
{% endif %}
